<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daara Hizbut-Tarqiyyah — Portail Officiel</title>
  
  <!-- Redirection immédiate vers le serveur d'application local -->
  <meta http-equiv="refresh" content="0; url=http://localhost:3000/">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    // Redirection automatique instantanée vers le serveur Vite actif
    window.location.href = "http://localhost:3000/";
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, #0A261A 0%, #061A12 100%);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 36px 28px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(45, 134, 96, 0.25);
      border: 1px solid rgba(45, 134, 96, 0.4);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      color: #6EE7B7;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10B981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p {
      color: #A7F3D0;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 800;
      font-size: 14px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.5);
    }
    .links-grid {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
      color: #9CA3AF;
    }
    .links-grid a {
      color: #6EE7B7;
      text-decoration: none;
      font-weight: 600;
    }
    .links-grid a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      <span>Serveur Actif</span>
    </div>
    <h1>Daara Hizbut-Tarqiyyah</h1>
    <p>Redirection automatique vers l'application...</p>
    
    <a href="http://localhost:3000/" class="btn">
      Ouvrir l'application (http://localhost:3000/)
    </a>

    <div class="links-grid">
      <div>Sur téléphone (même Wi-Fi) : <a href="http://10.51.126.110:3000/" target="_blank">http://10.51.126.110:3000/</a></div>
    </div>
  </div>
</body>
</html>
