        setIsAddMembreOpen(false);

          return;
        }
        const target = membres.find(m => m.id === membreToDeleteId);
        const name = target ? `${target.prenom} ${target.nom}` : '';

        setMembres(prev => prev.filter(m => m.id !== membreToDeleteId));
        if (selectedMembreId === membreToDeleteId) setSelectedMembreId(null);
        setIsDeleteMembreOpen(false);
        showToast(`Membre ${name} supprimé. Motif: "${deleteJustification}"`);

        setSeances(prev => prev.map(s => {
          if (s.id !== seanceId) return s;
          const idx = s.presences.findIndex(p => p.membre_id === membreId);

          if (idx >= 0) {
            updated[idx] = { ...updated[idx], statut: newStatut };
          } else {
            updated.push({ membre_id: membreId, statut: newStatut });

          return { ...s, presences: updated };

                <form onSubmit={handleConfirmDeleteWithJustification} className="space-y-4">
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-ht-sage uppercase tracking-wider block">Membre à supprimer</label>
                    <select
                      value={membreToDeleteId}
                      onChange={(e) => setMembreToDeleteId(e.target.value)}
                      className="w-full p-3 bg-ht-page border border-ht-line rounded-xl text-xs font-semibold text-ht-ink"
                    >
                      {membres.map(m => (
                        <option key={m.id} value={m.id}>{m.prenom} {m.nom} ({m.telephone})</option>
                      ))}
                    </select>
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs font-bold text-ht-clay uppercase tracking-wider block">
                      Justification / Motif de suppression <span className="text-red-500">*</span>
                    </label>
                    <textarea
                      required
                      rows="3"
                      placeholder="Ex: Déménagement, inactivité prolongée, demande du membre..."
                      value={deleteJustification}
                      onChange={(e) => setDeleteJustification(e.target.value)}
                      className="w-full p-3 bg-ht-page border border-red-200 rounded-xl text-xs text-ht-ink placeholder:text-gray-400 focus:outline-none focus:border-ht-clay focus:ring-1 focus:ring-ht-clay"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-3 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsDeleteMembreOpen(false)}
                      className="btn-anim px-4 py-2.5 border border-ht-line rounded-xl text-xs font-semibold text-ht-inkSoft"
                    >
                      Annuler
                    </button>
                    <button
                      type="submit"
                      className="btn-anim px-5 py-2.5 bg-red-600 text-white rounded-xl text-xs font-bold shadow-md hover:bg-red-700"
                    >
                      Confirmer la suppression
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Ajouter Membre */}
          {isAddMembreOpen && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 w-full max-w-md space-y-4">
                <h3 className="font-bold text-lg text-ht-ink">Ajouter un nouveau membre</h3>
                <form onSubmit={handleAddMembre} className="space-y-3">
                  <input name="nom" required placeholder="Nom" className="w-full p-2.5 bg-ht-page border rounded-xl text-xs" />
                  <input name="prenom" required placeholder="Prénom" className="w-full p-2.5 bg-ht-page border rounded-xl text-xs" />
                  <input name="telephone" required placeholder="Téléphone" className="w-full p-2.5 bg-ht-page border rounded-xl text-xs" />
                  <input name="profession" placeholder="Profession" className="w-full p-2.5 bg-ht-page border rounded-xl text-xs" />
                  <select name="kourel_id" className="w-full p-2.5 bg-ht-page border rounded-xl text-xs">
                    {kourels.map(k => <option key={k.id} value={k.id}>{k.nom}</option>)}
                  </select>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsAddMembreOpen(false)} className="btn-anim px-4 py-2 border rounded-xl text-xs">Annuler</button>
                    <button type="submit" className="btn-anim px-4 py-2 gradient-emerald text-white rounded-xl text-xs font-bold">Enregistrer</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
