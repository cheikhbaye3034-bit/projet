              ),
              e('div', { className: 'bg-white rounded-3xl p-6 border border-ht-line shadow-soft' },
                e('div', { className: 'font-display font-extrabold text-4xl text-ht-ink mb-1' }, '12'),
                e('div', { className: 'text-xs text-ht-inkSoft font-medium' }, 'Retards ce mois')
              )
            ),
            e('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-6' },
              e('div', { className: 'bg-white rounded-3xl p-6 border border-ht-line shadow-soft space-y-4' },
                e('h3', { className: 'font-bold text-lg text-ht-ink' }, 'Évolution de la présence'),
                e('div', { className: 'h-48 flex items-end justify-between gap-2 border-b border-ht-line pb-2 px-2' },
                  ['S1', 'S2', 'S3', 'S4', 'S5', 'S6', 'S7', 'S8'].map((s, idx) => {
                    const heights = [65, 70, 60, 80, 85, 80, 92, 87];
                    return e('div', { key: s, className: 'flex-1 flex flex-col items-center gap-2' },
                      e('div', { className: 'w-full bg-ht-mist rounded-t-lg relative', style: { height: `${heights[idx]}px` } },
                        e('div', { className: 'w-full h-1 bg-ht-emerald rounded-full' })
                      ),
                      e('span', { className: 'text-[10px] text-ht-sage font-medium' }, s)
                    );
                  })
                )
              ),
              e('div', { className: 'bg-white rounded-3xl p-6 border border-ht-line shadow-soft flex flex-col justify-between' },
                e('div', null,
                  e('h3', { className: 'font-bold text-lg text-ht-ink mb-4' }, 'Répartition des 30 Juki (Kamil)'),
                  e('div', { className: 'w-40 h-40 mx-auto rounded-full border-[12px] border-slate-200 border-t-[#1F6B4B] border-r-[#D97706] flex flex-col items-center justify-center' },
                    e('span', { className: 'font-display font-extrabold text-2xl text-ht-ink' }, `${terminesKamil}/30`),
                    e('span', { className: 'text-xs text-ht-sage' }, 'parties')
                  )
                ),
                e('div', { className: 'pt-4 space-y-2 text-xs font-medium' },
                  e('div', { className: 'flex justify-between p-2 bg-emerald-50 rounded-xl' }, e('span', null, '🟢 Terminé'), e('span', { className: 'font-bold' }, terminesKamil)),
                  e('div', { className: 'flex justify-between p-2 bg-amber-50 rounded-xl' }, e('span', null, '🟠 En cours'), e('span', { className: 'font-bold' }, enCoursKamil)),
                  e('div', { className: 'flex justify-between p-2 bg-slate-50 rounded-xl' }, e('span', null, '⚪ À faire'), e('span', { className: 'font-bold' }, aFaireKamil))
                )
              )
            )
          ),

          // TAB: MEMBRES
          activeTab === 'membres' && e('div', { className: 'space-y-6' },
            e('div', { className: 'flex flex-col sm:flex-row justify-between items-center gap-4' },
              e('div', { className: 'relative flex-1 max-w-sm' },
                e(Icon, { path: PATHS.search, className: 'w-4 h-4 text-ht-sage absolute left-3.5 top-1/2 -translate-y-1/2' }),
                e('input', {
                  type: 'text',
                  placeholder: 'Rechercher membre par nom...',
                  value: searchQuery,
                  onChange: (ev) => setSearchQuery(ev.target.value),
                  className: 'w-full pl-10 pr-4 py-2.5 bg-white border border-ht-line rounded-xl text-xs'
                })
              ),
              e('button', {
                onClick: () => setIsAddMembreOpen(true),
                className: 'px-5 py-2.5 gradient-emerald text-white rounded-xl text-xs font-bold shadow-md hover:shadow-lg transition-all flex items-center gap-2'
              }, e(Icon, { path: PATHS.plus, className: 'w-4 h-4' }), 'Ajouter un membre')
            ),
            e('div', { className: 'bg-white rounded-3xl border border-ht-line shadow-soft overflow-hidden' },
              e('table', { className: 'w-full text-left border-collapse' },
                e('thead', null,
                  e('tr', { className: 'bg-ht-page border-b border-ht-line text-xs font-semibold text-ht-sage uppercase' },
                    e('th', { className: 'py-4 px-6' }, 'Membre'),
                    e('th', { className: 'py-4 px-6' }, 'Téléphone'),
                    e('th', { className: 'py-4 px-6' }, 'Profession'),
                    e('th', { className: 'py-4 px-6' }, 'Kourel'),
                    e('th', { className: 'py-4 px-6' }, 'Statut')
                  )
                ),
                e('tbody', { className: 'divide-y divide-ht-line text-sm' },
                  membres.filter(m => `${m.prenom} ${m.nom}`.toLowerCase().includes(searchQuery.toLowerCase())).map(m => {
                    const k = kourels.find(k => k.id === m.kourel_id);
                    return e('tr', { key: m.id, className: 'hover:bg-ht-mist/50 transition-colors' },
                      e('td', { className: 'py-4 px-6 font-semibold' }, `${m.prenom} ${m.nom}`),
                      e('td', { className: 'py-4 px-6 text-xs text-ht-inkSoft' }, m.telephone),
                      e('td', { className: 'py-4 px-6 text-xs' }, m.profession),
                      e('td', { className: 'py-4 px-6 text-xs font-semibold text-ht-emerald' }, k ? k.nom.split('—')[1] || k.nom : '-'),
                      e('td', { className: 'py-4 px-6' }, e('span', { className: 'badge-present' }, m.statut))
                    );
                  })
                )
              )
            )
          ),

          // TAB: REPETITION
          activeTab === 'repetition' && e('div', { className: 'space-y-6' },
            e('div', { className: 'bg-white rounded-3xl p-6 border border-ht-line shadow-soft flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4' },
              e('div', null,
                e('h3', { className: 'font-bold text-xl text-ht-ink' }, 'Séances de Répétition & Pointage'),
                e('p', { className: 'text-xs text-ht-inkSoft' }, 'Superviseur : Serigne Modou Kara')
              ),
              e('div', { className: 'flex flex-wrap gap-2' },
                kourels.map(k => e('button', {
                  key: k.id,
                  onClick: () => setSelectedKourelId(k.id),
                  className: `px-4 py-2 rounded-xl text-xs font-semibold transition-all ${
                    selectedKourelId === k.id ? 'gradient-emerald text-white shadow-sm' : 'bg-ht-page text-ht-inkSoft hover:bg-ht-mist'
                  }`
                }, k.nom.split('—')[1] || k.nom))
              )
            ),
            e('div', { className: 'bg-white rounded-3xl border border-ht-line shadow-soft overflow-hidden p-6' },
              e('h4', { className: 'font-bold text-base text-ht-ink mb-4' }, 'Pointage des membres'),
              e('table', { className: 'w-full text-left border-collapse' },
                e('thead', null,
                  e('tr', { className: 'border-b border-ht-line text-xs text-ht-sage uppercase' },
                    e('th', { className: 'py-3 px-4' }, 'Membre'),
                    e('th', { className: 'py-3 px-4' }, 'Statut actuel'),
                    e('th', { className: 'py-3 px-4 text-right' }, 'Action 1-Clic')
                  )
                ),
                e('tbody', { className: 'divide-y divide-ht-line text-sm' },
                  membersOfKourel.map(m => {
                    const pres = activeSeance.presences.find(p => p.membre_id === m.id);
                    const st = pres ? pres.statut : 'Non pointé';
                    return e('tr', { key: m.id },
                      e('td', { className: 'py-3.5 px-4 font-medium' }, `${m.prenom} ${m.nom}`),
                      e('td', { className: 'py-3.5 px-4' },
                        e('span', { className: st === 'Présent' ? 'badge-present' : st === 'En retard' ? 'badge-retard' : 'badge-absent' }, st)
                      ),
                      e('td', { className: 'py-3.5 px-4 text-right space-x-2' },
                        e('button', { onClick: () => updatePointage(activeSeance.id, m.id, 'Présent'), className: 'px-3 py-1 bg-ht-mist text-ht-emerald rounded-lg text-xs font-bold hover:bg-ht-mint' }, 'Présent'),
                        e('button', { onClick: () => updatePointage(activeSeance.id, m.id, 'En retard'), className: 'px-3 py-1 bg-amber-50 text-ht-amber rounded-lg text-xs font-bold hover:bg-amber-100' }, 'En retard'),
                        e('button', { onClick: () => updatePointage(activeSeance.id, m.id, 'Absent'), className: 'px-3 py-1 bg-red-50 text-ht-clay rounded-lg text-xs font-bold hover:bg-red-100' }, 'Absent')
                      )
                    );
                  })
                )
              )
            )
          ),

          // TAB: KAMIL
          activeTab === 'kamil' && e('div', { className: 'space-y-6' },
            e('div', { className: 'bg-white rounded-3xl p-6 border border-ht-line shadow-soft flex justify-between items-center' },
              e('div', null,
                e('h2', { className: 'font-bold text-2xl text-ht-ink' }, `Cycle Kamil #${kamilCycle.numero_cycle} en cours`),
                e('p', { className: 'text-xs text-ht-inkSoft' }, 'Lecture globale du Coran en 30 parties (Juki)')
              ),
              e('div', { className: 'px-4 py-2 gradient-emerald text-white rounded-xl font-bold text-xs shadow-md' }, `${terminesKamil}/30 Complétés`)
            ),
            e('div', { className: 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3' },
              kamilCycle.assignations.map(a => {
                const m = membres.find(mem => mem.id === a.membre_id);
                const isTermine = a.statut === 'Terminé';
                const isInProgress = a.statut === 'En cours';

                return e('div', {
                  key: a.juz,
                  className: `p-4 rounded-2xl border transition-all ${
                    isTermine ? 'bg-emerald-50/70 border-emerald-300' : isInProgress ? 'bg-amber-50/80 border-amber-300' : 'bg-white border-slate-200'
                  }`
                },
                  e('div', { className: 'font-extrabold text-lg text-ht-ink' }, `Juki #${a.juz}`),
                  e('div', { className: 'text-xs text-ht-sage truncate mt-1' }, m ? `${m.prenom} ${m.nom}` : 'Attribué'),
                  e('div', { className: 'mt-3 pt-2 border-t border-ht-line flex justify-between items-center text-xs' },
                    e('span', { className: `font-bold px-2 py-0.5 rounded-md ${
                      isTermine ? 'bg-[#1F6B4B] text-white' : isInProgress ? 'bg-[#D97706] text-white' : 'bg-slate-200 text-slate-700'
                    }` }, a.statut),
                    !isTermine && e('button', {
                      onClick: () => updateJuzStatut(a.juz, 'Terminé'),
                      className: 'text-[10px] bg-ht-emerald text-white px-2 py-1 rounded-lg hover:bg-ht-fern'
                    }, 'Valider')
                  )
                );
              })
            )
          ),

          // TAB: INFO
          activeTab === 'info' && e('div', { className: 'space-y-6 max-w-4xl' },
            e('h2', { className: 'font-bold text-2xl text-ht-ink' }, 'Informations & Actualités'),
            informations.map(inf => e('div', { key: inf.id, className: 'bg-white rounded-3xl p-6 border border-ht-line shadow-soft space-y-3' },
              e('span', { className: 'badge-present' }, inf.categorie),
              e('h3', { className: 'font-bold text-xl text-ht-ink' }, inf.titre),
              e('p', { className: 'text-xs text-ht-inkSoft leading-relaxed' }, inf.contenu),
              e('div', { className: 'text-[11px] text-ht-sage font-medium pt-2 border-t border-ht-line' }, `Publié le ${inf.date_publication} par ${inf.auteur}`)
            ))
          )
        ),

        // Add Member Modal
        isAddMembreOpen && e('div', { className: 'fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50' },
          e('div', { className: 'bg-white rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl' },
            e('div', { className: 'flex justify-between items-center' },
              e('h3', { className: 'font-bold text-lg text-ht-ink' }, 'Ajouter un nouveau membre'),
              e('button', { onClick: () => setIsAddMembreOpen(false), className: 'text-gray-400 hover:text-gray-600 font-bold' }, '✕')
            ),
            e('form', { onSubmit: handleAddMembre, className: 'space-y-3' },
              e('input', { name: 'nom', required: true, placeholder: 'Nom (ex: MBACKE)', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('input', { name: 'prenom', required: true, placeholder: 'Prénom (ex: Serigne Cheikh)', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('input', { name: 'telephone', required: true, placeholder: 'Téléphone (ex: +221 77 123 45 67)', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('input', { name: 'adresse', placeholder: 'Adresse (ex: Touba Mosquée)', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('select', { name: 'kourel_id', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' },
                kourels.map(k => e('option', { key: k.id, value: k.id }, k.nom))
              ),
              e('div', { className: 'flex justify-end gap-2 pt-2' },
                e('button', { type: 'button', onClick: () => setIsAddMembreOpen(false), className: 'px-4 py-2 border rounded-xl text-xs font-semibold' }, 'Annuler'),
                e('button', { type: 'submit', className: 'px-4 py-2 gradient-emerald text-white rounded-xl text-xs font-bold shadow-md' }, 'Enregistrer')
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
