                  e('div', { className: 'col-span-2' }, e('strong', null, 'Adresse: '), selectedMembreModal.adresse || 'Touba Mosquée'),
                  e('div', null, e('strong', null, 'Adhésion: '), selectedMembreModal.date_adhesion),
                  e('div', null, e('strong', null, 'Cotisation: '), selectedMembreModal.cotisation_statut)
                )
              ),

              // Presence, Retard, Absence Stats
              e('div', { className: 'bg-white/90 backdrop-blur-md rounded-2xl p-4 border border-ht-line space-y-2 shadow-soft' },
                e('div', { className: 'font-bold text-xs text-ht-ink mb-2' }, 'Statistiques d\'Assiduité & Absences'),
                e('div', { className: 'grid grid-cols-3 gap-2 text-center text-xs' },
                  e('div', { className: 'p-2.5 bg-ht-mist rounded-xl border border-ht-mint font-bold text-ht-emerald' },
                    e('div', { className: 'text-lg' }, selectedMembreModal.presences || 12),
                    e('div', { className: 'text-[10px] text-ht-sage font-normal' }, 'Présences')
                  ),
                  e('div', { className: 'p-2.5 bg-amber-50 rounded-xl border border-amber-200 font-bold text-ht-amber' },
                    e('div', { className: 'text-lg' }, selectedMembreModal.retards || 1),
                    e('div', { className: 'text-[10px] text-amber-700 font-normal' }, 'Retards')
                  ),
                  e('div', { className: 'p-2.5 bg-red-50 rounded-xl border border-red-200 font-bold text-ht-clay' },
                    e('div', { className: 'text-lg' }, selectedMembreModal.absences || 0),
                    e('div', { className: 'text-[10px] text-red-700 font-normal' }, 'Absences')
                  )
                )
              ),

              // Coran / Juki Assigned
              e('div', { className: 'bg-white/90 backdrop-blur-md rounded-2xl p-4 border border-ht-line space-y-2 shadow-soft' },
                e('div', { className: 'font-bold text-xs text-ht-ink' }, 'Juki (Portion du Coran Attribuée)'),
                (() => {
                  const jAssigned = kamilCycle.assignations.find(a => a.membre_id === selectedMembreModal.id);
                  return jAssigned ? e('div', { className: 'p-3 bg-ht-mist rounded-xl border border-ht-mint flex justify-between items-center text-xs' },
                    e('div', null,
                      e('div', { className: 'font-bold text-ht-emerald text-sm' }, `Juki #${jAssigned.juz}`),
                      e('div', { className: 'text-[11px] text-ht-inkSoft' }, jAssigned.nom_juz)
                    ),
                    e('span', { className: 'px-2.5 py-1 bg-ht-emerald text-white rounded-full font-bold text-[10px]' }, jAssigned.statut)
                  ) : e('div', { className: 'text-xs text-ht-sage italic p-2' }, 'Aucun Juki attribué actuellement sur ce cycle.');
                })()
              )
            ),

            // Footer with Delete CTA
            e('div', { className: 'p-4 border-t border-ht-line bg-white/90 backdrop-blur-md flex justify-between items-center relative z-10' },
              e('button', {
                onClick: () => handleDeleteMembre(selectedMembreModal.id),
                className: 'px-4 py-2 bg-red-50 text-ht-clay hover:bg-red-100 border border-red-200 rounded-xl text-xs font-bold flex items-center gap-1.5'
              }, e(Icon, { path: PATHS.trash, className: 'w-4 h-4 text-ht-clay' }), 'Supprimer le membre'),

              e('button', {
                onClick: () => setSelectedMembreModal(null),
                className: 'px-5 py-2 gradient-emerald text-white rounded-xl text-xs font-bold shadow-md'
              }, 'Fermer')
            )
          )
        ),

        // Delete Member Modal
        isDeleteModalOpen && e('div', { className: 'fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50' },
          e('div', { className: 'bg-white rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl border border-ht-line' },
            e('div', { className: 'flex justify-between items-center' },
              e('h3', { className: 'font-bold text-lg text-ht-clay flex items-center gap-2' },
                e(Icon, { path: PATHS.trash, className: 'w-5 h-5 text-ht-clay' }),
                'Supprimer un membre'
              ),
              e('button', { onClick: () => setIsDeleteModalOpen(false), className: 'text-gray-400 font-bold' }, '✕')
            ),
            e('p', { className: 'text-xs text-ht-inkSoft' }, 'Sélectionnez le membre à supprimer de la base de données :'),
            e('select', {
              className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs font-semibold',
              onChange: (ev) => handleDeleteMembre(ev.target.value)
            },
              e('option', { value: '' }, 'Sélectionner un membre...'),
              membres.map(m => e('option', { key: m.id, value: m.id }, `${m.prenom} ${m.nom}`))
            ),
            e('div', { className: 'flex justify-end pt-2' },
              e('button', { onClick: () => setIsDeleteModalOpen(false), className: 'px-4 py-2 border rounded-xl text-xs font-semibold' }, 'Annuler')
            )
          )
        ),

        // Add Member Modal
        isAddMembreOpen && e('div', { className: 'fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50' },
          e('div', { className: 'bg-white rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl' },
            e('div', { className: 'flex justify-between items-center' },
              e('h3', { className: 'font-bold text-lg text-ht-ink' }, 'Ajouter un nouveau membre'),
              e('button', { onClick: () => setIsAddMembreOpen(false), className: 'text-gray-400 hover:text-gray-600 font-bold' }, '✕')
            ),
            e('form', { onSubmit: handleAddMembre, className: 'space-y-3' },
              e('input', { name: 'nom', required: true, placeholder: 'Nom (ex: FALL)', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('input', { name: 'prenom', required: true, placeholder: 'Prénom (ex: Modou)', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('input', { name: 'telephone', required: true, placeholder: 'Téléphone (ex: +221 77 123 45 67)', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('input', { name: 'adresse', placeholder: 'Adresse (ex: Touba Mosquée)', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('select', { name: 'kourel_id', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' },
                kourels.map(k => e('option', { key: k.id, value: k.id }, k.nom))
              ),
              e('div', { className: 'flex justify-end gap-2 pt-2' },
                e('button', { type: 'button', onClick: () => setIsAddMembreOpen(false), className: 'px-4 py-2 border rounded-xl text-xs font-semibold' }, 'Annuler'),
                e('button', { type: 'submit', className: 'px-4 py-2 gradient-emerald text-white rounded-xl text-xs font-bold shadow-md' }, 'Enregistrer')
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
