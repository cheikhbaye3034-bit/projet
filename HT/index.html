          nom: fd.get('nom'),
          prenom: fd.get('prenom'),
          telephone: fd.get('telephone'),
          adresse: fd.get('adresse'),
          profession: fd.get('profession') || 'Salarié',
          date_adhesion: new Date().toISOString().split('T')[0],
          statut: 'Actif',
          kourel_id: fd.get('kourel_id') || 'k1'

        setIsAddMembreOpen(false);
        showToast(`Membre ${newM.prenom} ${newM.nom} ajouté avec succès !`);
      };

          const idx = s.presences.findIndex(p => p.membre_id === membreId);
          let updated = [...s.presences];
          if (idx >= 0) {
            updated[idx] = { ...updated[idx], statut: newStatut };
          } else {
            updated.push({ membre_id: membreId, statut: newStatut });
          }
          return { ...s, presences: updated };
        }));
        showToast(`Pointage mis à jour : ${newStatut}`);
      };

      const updateJuzStatut = (juzNum, newStatut) => {
        setKamilCycle(prev => ({
          ...prev,
          assignations: prev.assignations.map(a => a.juz === juzNum ? { ...a, statut: newStatut } : a)
        }));
        showToast(`Juki #${juzNum} marqué comme ${newStatut}`);
      };

      const assignJuzToMembre = (juzNum, membreId) => {
        setKamilCycle(prev => ({
          ...prev,
          assignations: prev.assignations.map(a => a.juz === juzNum ? { ...a, membre_id: membreId } : a)

        showToast(`Juki #${juzNum} réattribué à ${targetM ? targetM.prenom + ' ' + targetM.nom : 'Membre'}`);

              e('p', { className: 'text-xs text-gray-200' }, 'Convocations, programmes des répétitions et notes d’organisation de Hizbut-Tarqiyyah.')
            ),
            informations.map(inf => e('div', { key: inf.id, className: 'bg-white rounded-3xl p-6 border border-ht-line shadow-soft space-y-3' },
              e('span', { className: 'badge-present' }, inf.categorie),
              e('h3', { className: 'font-bold text-xl text-ht-ink' }, inf.titre),
              e('p', { className: 'text-xs text-ht-inkSoft leading-relaxed' }, inf.contenu),
              e('div', { className: 'text-[11px] text-ht-sage font-medium pt-2 border-t border-ht-line' }, `Publié le ${inf.date_publication} par ${inf.auteur}`)
            ))
          )
        ),

        // Modal Attribution Juki (Permet au responsable d'assigner les Juki aux membres)
        isAttributionModalOpen && e('div', { className: 'fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50' },
          e('div', { className: 'bg-white rounded-3xl w-full max-w-2xl max-h-[85vh] shadow-2xl border border-ht-line flex flex-col overflow-hidden' },
            // Header
            e('div', { className: 'p-5 border-b border-ht-line flex justify-between items-center bg-ht-page' },
              e('div', null,
                e('h3', { className: 'font-bold text-lg text-ht-ink' }, 'Attribution & Affectation des 30 Juki'),
                e('p', { className: 'text-xs text-ht-emerald font-semibold' }, 'Assigner chaque portion du Coran au membre responsable de sa récitation')
              ),
              e('button', { onClick: () => setIsAttributionModalOpen(false), className: 'text-gray-400 hover:text-gray-600 font-bold text-lg' }, '✕')
            ),
            // Filter Bar & Auto-distribute CTA
            e('div', { className: 'p-4 border-b border-ht-line bg-white flex flex-col sm:flex-row justify-between items-center gap-3' },
              e('div', { className: 'relative flex-1 w-full' },
                e(Icon, { path: PATHS.search, className: 'w-4 h-4 text-ht-sage absolute left-3.5 top-1/2 -translate-y-1/2' }),
                e('input', {
                  type: 'text',
                  placeholder: 'Rechercher un Juki ou un membre...',
                  value: assignSearch,
                  onChange: (ev) => setAssignSearch(ev.target.value),
                  className: 'w-full pl-10 pr-4 py-2 bg-ht-page border border-ht-line rounded-xl text-xs'
                })
              ),
              e('button', {
                onClick: handleAutoDistribute,
                className: 'px-4 py-2 bg-ht-mist text-ht-emerald border border-ht-mint rounded-xl text-xs font-bold hover:bg-ht-mint whitespace-nowrap'
              }, '✨ Répartir Automatiquement')
            ),
            // Juki Assignments List
            e('div', { className: 'flex-1 overflow-y-auto p-4 space-y-2' },
              kamilCycle.assignations
                .filter(a => {
                  const m = membres.find(mem => mem.id === a.membre_id);
                  const mName = m ? `${m.prenom} ${m.nom}` : '';
                  const q = assignSearch.toLowerCase();
                  return `juki ${a.juz}`.includes(q) || `${a.juz}`.includes(q) || mName.toLowerCase().includes(q);
                })
                .map(a => {
                  const currentM = membres.find(mem => mem.id === a.membre_id);
                  return e('div', { key: a.juz, className: 'p-3 bg-ht-page rounded-2xl border border-ht-line flex items-center justify-between gap-4' },
                    e('div', { className: 'flex items-center gap-3' },
                      e('div', { className: 'w-8 h-8 rounded-full gradient-emerald text-white font-extrabold text-xs flex items-center justify-center' }, a.juz),
                      e('span', { className: 'font-bold text-sm text-ht-ink' }, `Juki ${a.juz}`)
                    ),
                    e('select', {
                      value: a.membre_id,
                      onChange: (ev) => assignJuzToMembre(a.juz, ev.target.value),
                      className: 'p-2 bg-white border border-ht-line rounded-xl text-xs font-semibold text-ht-ink focus:border-ht-fern'
                    },
                      membres.map(m => e('option', { key: m.id, value: m.id }, `${m.prenom} ${m.nom}`))
                    )
                  );
                })
            ),
            // Footer
            e('div', { className: 'p-4 border-t border-ht-line bg-ht-page flex justify-end' },
              e('button', {
                onClick: () => setIsAttributionModalOpen(false),
                className: 'px-5 py-2 gradient-emerald text-white rounded-xl text-xs font-bold shadow-md'
              }, 'Fermer & Appliquer')
            )
          )
        ),

        // Add Member Modal
        isAddMembreOpen && e('div', { className: 'fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50' },
          e('div', { className: 'bg-white rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl' },
            e('div', { className: 'flex justify-between items-center' },
              e('h3', { className: 'font-bold text-lg text-ht-ink' }, 'Ajouter un nouveau membre'),
              e('button', { onClick: () => setIsAddMembreOpen(false), className: 'text-gray-400 hover:text-gray-600 font-bold' }, '✕')
            ),
            e('form', { onSubmit: handleAddMembre, className: 'space-y-3' },
              e('input', { name: 'nom', required: true, placeholder: 'Nom (ex: FALL)', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('input', { name: 'prenom', required: true, placeholder: 'Prénom (ex: Modou)', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('input', { name: 'telephone', required: true, placeholder: 'Téléphone (ex: +221 77 123 45 67)', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('input', { name: 'adresse', placeholder: 'Adresse (ex: Touba Mosquée)', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('select', { name: 'kourel_id', className: 'w-full p-2.5 bg-ht-page border border-ht-line rounded-xl text-xs' },
                kourels.map(k => e('option', { key: k.id, value: k.id }, k.nom))
              ),
              e('div', { className: 'flex justify-end gap-2 pt-2' },
                e('button', { type: 'button', onClick: () => setIsAddMembreOpen(false), className: 'px-4 py-2 border rounded-xl text-xs font-semibold' }, 'Annuler'),
                e('button', { type: 'submit', className: 'px-4 py-2 gradient-emerald text-white rounded-xl text-xs font-bold shadow-md' }, 'Enregistrer')
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
