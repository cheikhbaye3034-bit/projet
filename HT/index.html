            ),
            e('div', { className: 'p-4 sm:p-6 space-y-4 overflow-y-auto relative z-10 flex-1' },
              e('div', { className: 'bg-white/90 backdrop-blur-md rounded-2xl p-4 sm:p-5 border border-ht-line space-y-4 shadow-soft' },
                e('div', { className: 'flex items-center justify-between border-b border-ht-line pb-3' },
                  e('div', { className: 'flex items-center gap-2' },
                    e(Icon, { path: PATHS.user, className: 'w-4 h-4 text-ht-emerald' }),
                    e('span', { className: 'text-xs font-bold text-ht-ink uppercase tracking-wider' }, 'Informations Personnelles')
                  ),
                  e('span', { className: 'px-3 py-1 text-xs font-extrabold rounded-full bg-ht-mist text-ht-emerald border border-ht-mint' }, selectedMembreModal.statut)
                ),
                e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs' },
                  e('div', { className: 'p-3 bg-ht-page/90 rounded-xl border border-ht-line space-y-1' },
                    e('span', { className: 'text-[10px] font-bold text-ht-sage uppercase tracking-wider block' }, 'Prénom'),
                    e('span', { className: 'font-bold text-sm text-ht-ink block' }, selectedMembreModal.prenom)
                  ),
                  e('div', { className: 'p-3 bg-ht-page/90 rounded-xl border border-ht-line space-y-1' },
                    e('span', { className: 'text-[10px] font-bold text-ht-sage uppercase tracking-wider block' }, 'Nom'),
                    e('span', { className: 'font-extrabold text-sm text-ht-ink uppercase tracking-wide block' }, selectedMembreModal.nom)
                  ),
                  e('div', { className: 'p-3 bg-ht-page/90 rounded-xl border border-ht-line space-y-1' },
                    e('span', { className: 'text-[10px] font-bold text-ht-sage uppercase tracking-wider block' }, 'Téléphone'),
                    e('div', { className: 'flex items-center gap-2 font-mono font-bold text-ht-emerald' },
                      e(Icon, { path: PATHS.phone, className: 'w-3.5 h-3.5 text-ht-sage' }),
                      selectedMembreModal.telephone
                    )
                  ),
                  e('div', { className: 'p-3 bg-ht-page/90 rounded-xl border border-ht-line space-y-1' },
                    e('span', { className: 'text-[10px] font-bold text-ht-sage uppercase tracking-wider block' }, 'Secteur de travail'),
                    e('div', { className: 'flex items-center gap-2 font-semibold text-ht-ink' },
                      e(Icon, { path: PATHS.briefcase, className: 'w-3.5 h-3.5 text-ht-sage' }),
                      secteurs.find(s => s.id === selectedMembreModal.secteur_id)?.nom || 'Organisation'
                    )
                  )
                )
              )
            ),
            e('div', { className: 'p-4 border-t border-ht-line bg-white/90 backdrop-blur-md flex justify-between items-center relative z-10' },
              e('button', {
                onClick: () => handleDeleteMembre(selectedMembreModal.id),
                className: 'px-4 py-2.5 bg-red-50 text-ht-clay hover:bg-red-100 border border-red-200 rounded-xl text-xs font-bold flex items-center gap-1.5 cursor-pointer min-h-[40px]'
              }, e(Icon, { path: PATHS.trash, className: 'w-4 h-4 text-ht-clay' }), 'Supprimer le membre'),
              e('button', { onClick: () => setSelectedMembreModal(null), className: 'px-5 py-2.5 gradient-emerald text-white rounded-xl text-xs font-bold shadow-md cursor-pointer min-h-[40px]' }, 'Fermer')
            )
          )
        ),

        // DELETE MEMBER MODAL
        isDeleteModalOpen && e('div', { className: 'fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50 overflow-y-auto' },
          e('div', { className: 'bg-white rounded-3xl p-5 sm:p-6 w-full max-w-md space-y-4 shadow-2xl border border-ht-line my-auto max-h-[92vh] overflow-y-auto' },
            e('div', { className: 'flex justify-between items-center' },
              e('h3', { className: 'font-bold text-lg text-ht-clay flex items-center gap-2' },
                e(Icon, { path: PATHS.trash, className: 'w-5 h-5 text-ht-clay' }),
                'Supprimer un membre'
              ),
              e('button', { onClick: () => setIsDeleteModalOpen(false), className: 'text-gray-400 hover:text-gray-600 font-bold p-1' }, '✕')
            ),
            e('p', { className: 'text-xs text-ht-inkSoft' }, 'Sélectionnez le membre à supprimer définitivement de la base de données :'),
            e('select', {
              value: membreToDeleteId,
              className: 'w-full p-3 bg-ht-page border border-ht-line rounded-xl text-xs font-semibold text-ht-ink focus:outline-none focus:border-ht-fern',
              onChange: (ev) => setMembreToDeleteId(ev.target.value)
            },
              e('option', { value: '' }, 'Sélectionner un membre à supprimer...'),
              membres.map(m => e('option', { key: m.id, value: m.id }, `${m.prenom} ${m.nom}`))
            ),
            e('div', { className: 'flex justify-end gap-2 pt-2' },
              e('button', { onClick: () => setIsDeleteModalOpen(false), className: 'px-4 py-2.5 border rounded-xl text-xs font-semibold min-h-[40px]' }, 'Annuler'),
              e('button', {
                onClick: () => handleDeleteMembre(membreToDeleteId),
                disabled: !membreToDeleteId,
                className: `px-5 py-2.5 text-white rounded-xl text-xs font-bold shadow-md min-h-[40px] ${membreToDeleteId ? 'bg-red-600 hover:bg-red-700 cursor-pointer' : 'bg-gray-300 cursor-not-allowed'}`
              }, 'Confirmer la suppression')
            )
          )
        ),

        // ADD MEMBER MODAL
        isAddMembreOpen && e('div', { className: 'fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50 overflow-y-auto' },
          e('div', { className: 'bg-white rounded-3xl p-5 sm:p-6 w-full max-w-md space-y-4 shadow-2xl border border-ht-line my-auto max-h-[92vh] overflow-y-auto' },
            e('div', { className: 'flex justify-between items-center' },
              e('h3', { className: 'font-bold text-lg text-ht-ink' }, 'Ajouter un nouveau membre'),
              e('button', { onClick: () => setIsAddMembreOpen(false), className: 'text-gray-400 hover:text-gray-600 font-bold p-1' }, '✕')
            ),
            e('form', { onSubmit: handleAddMembre, className: 'space-y-3' },
              e('input', { name: 'nom', required: true, placeholder: 'Nom (ex: FALL)', className: 'w-full p-3 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('input', { name: 'prenom', required: true, placeholder: 'Prénom (ex: Modou)', className: 'w-full p-3 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('input', { name: 'telephone', required: true, placeholder: 'Téléphone (ex: +221 77 123 45 67)', className: 'w-full p-3 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('input', { name: 'adresse', placeholder: 'Adresse (ex: Touba Mosquée)', className: 'w-full p-3 bg-ht-page border border-ht-line rounded-xl text-xs' }),
              e('select', { name: 'kourel_id', className: 'w-full p-3 bg-ht-page border border-ht-line rounded-xl text-xs' },
                kourels.map(k => e('option', { key: k.id, value: k.id }, k.nom))
              ),
              e('div', { className: 'flex justify-end gap-2 pt-2' },
                e('button', { type: 'button', onClick: () => setIsAddMembreOpen(false), className: 'px-4 py-2.5 border rounded-xl text-xs font-semibold min-h-[40px]' }, 'Annuler'),
                e('button', { type: 'submit', className: 'px-5 py-2.5 gradient-emerald text-white rounded-xl text-xs font-bold shadow-md min-h-[40px]' }, 'Enregistrer')
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
