<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body, html { margin: 0; padding: 0; background: transparent; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.src = '1787528591787.png';
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      // 1. Draw entire original image
      ctx.drawImage(img, 0, 0);

      // 2. Clear out the old logo in top-left (y: ~50 to ~320, x: ~30 to ~400) with pure white
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(20, 60, 420, 260);

      // 3. Clear out the center watermark (y: ~380 to ~820, x: ~220 to ~680) with pure white
      ctx.fillRect(150, 380, 580, 460);

      // Notify completion
      document.title = "READY";
    };
  </script>
</body>
</html>
