                    <div>
                      <div className="text-xs font-bold text-ht-sage uppercase tracking-wider mb-3">DERNIÈRE ACTUALITÉ</div>
                      <div className="inline-block px-3 py-1 bg-ht-mist text-ht-emerald text-xs font-bold rounded-full border border-ht-mint mb-3">
                        Événement
                      </div>
                      <h3 className="font-display font-bold text-xl text-ht-ink mb-2">Grande Ziarra — date confirmée</h3>
                      <p className="text-xs text-ht-inkSoft leading-relaxed mb-6">
                        Les inscriptions pour le transport en bus sont ouvertes auprès des superviseurs.
                      </p>
                    </div>

                    <div className="pt-4 border-t border-ht-line">
                      <button onClick={() => setActiveTab('info')} className="text-xs font-bold text-ht-emerald hover:underline inline-flex items-center gap-1">
                        <span>Voir tout</span>
                        <span>→</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'membres' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row justify-between items-center gap-4">
                  <input
                    type="text"
                    placeholder="Rechercher membre par nom..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full sm:w-80 px-4 py-2.5 bg-white border border-ht-line rounded-xl text-sm"
                  />
                  <button onClick={() => setIsAddMembreOpen(true)} className="px-5 py-2.5 gradient-emerald text-white rounded-xl text-xs font-bold shadow-md">
                    + Ajouter un membre
                  </button>
                </div>

                <div className="bg-white rounded-3xl border border-ht-line shadow-soft overflow-hidden">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-ht-page border-b border-ht-line text-xs font-semibold text-ht-sage uppercase">
                        <th className="py-4 px-6">Membre</th>
                        <th className="py-4 px-6">Téléphone</th>
                        <th className="py-4 px-6">Profession</th>
                        <th className="py-4 px-6">Kourel</th>
                        <th className="py-4 px-6">Statut</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-ht-line text-sm">
                      {membres.filter(m => m.nom.toLowerCase().includes(searchQuery.toLowerCase()) || m.prenom.toLowerCase().includes(searchQuery.toLowerCase())).map(m => (
                        <tr key={m.id} className="hover:bg-ht-mist/50 transition-colors">
                          <td className="py-4 px-6 font-semibold">{m.prenom} {m.nom}</td>
                          <td className="py-4 px-6 text-xs text-ht-inkSoft">{m.telephone}</td>
                          <td className="py-4 px-6 text-xs">{m.profession}</td>
                          <td className="py-4 px-6 text-xs font-semibold text-ht-emerald">{kourels.find(k => k.id === m.kourel_id)?.nom || '-'}</td>
                          <td className="py-4 px-6">
                            <span className="badge-present">{m.statut}</span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'repetition' && (
              <div className="space-y-6">
                <div className="bg-white rounded-3xl p-6 border border-ht-line shadow-soft flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-xl text-ht-ink">Séances de Répétition & Pointage</h3>
                    <p className="text-xs text-ht-inkSoft">Superviseur : Serigne Modou Kara</p>
                  </div>
                  <div className="flex gap-2">
                    {kourels.map(k => (
                      <button
                        key={k.id}
                        onClick={() => setSelectedKourelId(k.id)}
                        className={`px-4 py-2 rounded-xl text-xs font-semibold ${selectedKourelId === k.id ? 'gradient-emerald text-white' : 'bg-ht-page text-ht-inkSoft'}`}
                      >
                        {k.nom.split('—')[1]}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="bg-white rounded-3xl border border-ht-line shadow-soft overflow-hidden p-6">
                  <h4 className="font-bold text-base text-ht-ink mb-4">Pointage des membres</h4>
                  <table className="w-full text-left">
                    <thead>
                      <tr className="border-b border-ht-line text-xs text-ht-sage uppercase">
                        <th className="py-3 px-4">Membre</th>
                        <th className="py-3 px-4">Statut</th>
                        <th className="py-3 px-4 text-right">Actions 1-Clic</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-ht-line text-sm">
                      {membersOfKourel.map(m => {
                        const presence = activeSeance.presences.find(p => p.membre_id === m.id);
                        const statut = presence?.statut || 'Non pointé';
                        return (
                          <tr key={m.id}>
                            <td className="py-3.5 px-4 font-medium">{m.prenom} {m.nom}</td>
                            <td className="py-3.5 px-4">
                              <span className={statut === 'Présent' ? 'badge-present' : statut === 'En retard' ? 'badge-retard' : 'badge-absent'}>{statut}</span>
                            </td>
                            <td className="py-3.5 px-4 text-right space-x-2">
                              <button onClick={() => updatePointage(activeSeance.id, m.id, 'Présent')} className="px-3 py-1 bg-ht-mist text-ht-emerald rounded-lg text-xs font-bold">Présent</button>
                              <button onClick={() => updatePointage(activeSeance.id, m.id, 'En retard')} className="px-3 py-1 bg-amber-50 text-ht-amber rounded-lg text-xs font-bold">En retard</button>
                              <button onClick={() => updatePointage(activeSeance.id, m.id, 'Absent')} className="px-3 py-1 bg-red-50 text-ht-clay rounded-lg text-xs font-bold">Absent</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'kamil' && (
              <div className="space-y-6">
                <div className="bg-white rounded-3xl p-6 border border-ht-line shadow-soft flex justify-between items-center">
                  <div>
                    <h2 className="font-bold text-2xl text-ht-ink">Cycle Kamil #{kamilCycle.numero_cycle} en cours</h2>
                    <p className="text-xs text-ht-inkSoft">Lecture globale du Coran en 30 parties (Juz')</p>
                  </div>
                  <div className="px-4 py-2 gradient-emerald text-white rounded-xl font-bold text-xs">
                    {terminesKamil}/30 Complétés
                  </div>
                </div>

                {/* Grid 30 Juz avec Couleurs Adaptatives */}
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                  {kamilCycle.assignations.map(a => {
                    const m = membres.find(mem => mem.id === a.membre_id);
                    const isTermine = a.statut === 'Terminé';
                    const isInProgress = a.statut === 'En cours';

                    return (
                      <div key={a.juz} className={`p-4 rounded-2xl border transition-all ${
                        isTermine ? 'bg-emerald-50/70 border-emerald-300' : isInProgress ? 'bg-amber-50/80 border-amber-300' : 'bg-white border-slate-200'
                      }`}>
                        <div className="font-extrabold text-lg text-ht-ink">Juz' #{a.juz}</div>
                        <div className="text-xs text-ht-sage truncate mt-1">{m ? `${m.prenom} ${m.nom}` : 'Attribué'}</div>
                        <div className="mt-3 pt-2 border-t border-ht-line flex justify-between items-center text-xs">
                          <span className={`font-bold px-2 py-0.5 rounded-md ${
                            isTermine ? 'bg-[#1F6B4B] text-white' : isInProgress ? 'bg-[#D97706] text-white' : 'bg-slate-200 text-slate-700'
                          }`}>{a.statut}</span>
                          {!isTermine && (
                            <button onClick={() => updateJuzStatut(a.juz, 'Terminé')} className="text-[10px] bg-ht-emerald text-white px-2 py-1 rounded-lg">Valider</button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'info' && (
              <div className="space-y-6 max-w-4xl">
                <h2 className="font-bold text-2xl text-ht-ink">Informations & Actualités</h2>
                {informations.map(inf => (
                  <div key={inf.id} className="bg-white rounded-3xl p-6 border border-ht-line shadow-soft">
                    <span className="badge-present mb-2">{inf.categorie}</span>
                    <h3 className="font-bold text-xl text-ht-ink mt-1 mb-2">{inf.titre}</h3>
                    <p className="text-xs text-ht-inkSoft leading-relaxed">{inf.contenu}</p>
                  </div>
                ))}
              </div>
            )}
          </main>

          {isAddMembreOpen && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 w-full max-w-md space-y-4">
                <h3 className="font-bold text-lg text-ht-ink">Ajouter un nouveau membre</h3>
                <form onSubmit={handleAddMembre} className="space-y-3">
                  <input name="nom" required placeholder="Nom" className="w-full p-2.5 bg-ht-page border rounded-xl text-xs" />
                  <input name="prenom" required placeholder="Prénom" className="w-full p-2.5 bg-ht-page border rounded-xl text-xs" />
                  <input name="telephone" required placeholder="Téléphone" className="w-full p-2.5 bg-ht-page border rounded-xl text-xs" />
                  <input name="profession" placeholder="Profession" className="w-full p-2.5 bg-ht-page border rounded-xl text-xs" />
                  <select name="kourel_id" className="w-full p-2.5 bg-ht-page border rounded-xl text-xs">
                    {kourels.map(k => <option key={k.id} value={k.id}>{k.nom}</option>)}
                  </select>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsAddMembreOpen(false)} className="px-4 py-2 border rounded-xl text-xs">Annuler</button>
                    <button type="submit" className="px-4 py-2 gradient-emerald text-white rounded-xl text-xs font-bold">Enregistrer</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
